# Configuração do Supabase CLI (supabase start / supabase db push / functions deploy).
project_id = "meu-financeiro"

[api]
schemas = ["public"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "br.com.meufinanceiro://login-callback"]
enable_signup = true

[auth.email]
enable_confirmations = true

# Cada função confere o usuário logado internamente (auth.getUser), o que
# funciona com as chaves novas (publishable/JWT assimétrico) e as antigas.
[functions.transcribe-audio]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.extract-transaction]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.financial-insights]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.admin-users]
verify_jwt = false
import_map = "./functions/deno.json"
