name: App Android (APK)

# Gera o APK do Sniper Finanças e publica em Releases:
#   https://github.com/<usuario>/financas/releases/latest
# Roda quando o app muda na main, ou manualmente em Actions → Run workflow.
#
# Opcional (recomendado): assinatura fixa, para instalar atualizações por cima
# sem desinstalar. Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD. Sem eles, cada APK sai com uma
# assinatura diferente e é preciso desinstalar antes de instalar o novo (os
# dados ficam na nuvem, nada se perde).
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Assinatura fixa (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Usando assinatura fixa."
          else
            echo "Sem assinatura fixa: usando a chave de depuração."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../sniper-financas.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Sniper Finanças para Android (versão ${{ github.run_number }})
          make_latest: true
          body: |
            Para instalar no Android: baixe **sniper-financas.apk** pelo celular, abra o arquivo e permita
            "instalar apps desta fonte" quando o Android pedir.
          files: sniper-financas.apk
