name: App Android (APK)

# Gera o APK do Sniper Finanças e publica em Releases:
#   https://github.com/<usuario>/financas/releases/latest
# Roda quando o app muda na main, ou manualmente em Actions → Run workflow.
#
# Assinatura fixa (para instalar atualizações por cima, sem desinstalar):
# a chave fica em app/android/keys/sniper-release.p12 (protegida por senha) e
# a senha no secret ANDROID_KEYSTORE_PASSWORD. Sem o secret, o APK sai com a
# chave de depuração (e aí é preciso desinstalar antes de atualizar).
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Assinatura fixa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            printf 'storeFile=../keys/sniper-release.p12\nstorePassword=%s\nkeyAlias=sniper\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Usando a assinatura fixa do Sniper Finanças."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_PASSWORD ausente: APK com chave de depuração (não atualiza por cima)."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../sniper-financas.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Sniper Finanças para Android (versão ${{ github.run_number }})
          make_latest: true
          body: |
            Para instalar no Android: baixe **sniper-financas.apk** pelo celular, abra o arquivo e permita
            "instalar apps desta fonte" quando o Android pedir.

            Já tem o app? Use **Configurações → Atualizar aplicativo**, ou instale este APK por cima.
          files: sniper-financas.apk
