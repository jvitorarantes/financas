name: Publicar site (GitHub Pages)

# Publica o app web em https://<usuario>.github.io/financas/ a cada push na main.
# Antes, em Settings do repositório:
#   1. Pages → Source: "GitHub Actions"
#   2. (opcional) Variables SUPABASE_URL e SUPABASE_ANON_KEY para usar outro
#      projeto; sem elas, vale o padrão de app/lib/app/env.dart.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Build web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          ${{ vars.SUPABASE_URL && format('--dart-define=SUPABASE_URL={0}', vars.SUPABASE_URL) || '' }}
          ${{ vars.SUPABASE_ANON_KEY && format('--dart-define=SUPABASE_ANON_KEY={0}', vars.SUPABASE_ANON_KEY) || '' }}
          --dart-define=AUTH_REDIRECT_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
