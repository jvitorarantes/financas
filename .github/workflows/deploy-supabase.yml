name: Publicar backend (Supabase)

# Aplica as migrations e publica as Edge Functions no seu projeto Supabase.
# Roda sozinho quando algo em supabase/ muda na main, ou manualmente em
# Actions → "Publicar backend (Supabase)" → Run workflow.
# Secrets necessários (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   id do projeto (o "xxxx" de https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD   senha do banco definida ao criar o projeto
#   GROQ_API_KEY           chave gratuita do Groq (transcrição)
#   ANTHROPIC_API_KEY      opcional (pago)
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Configure os secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Secrets das funções
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          [ -n "$GROQ_API_KEY" ] && args+=("GROQ_API_KEY=$GROQ_API_KEY")
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; fi
      - run: |
          for fn in transcribe-audio extract-transaction financial-insights; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done
